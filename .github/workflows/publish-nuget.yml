name: Publish to NuGet

on:
  push:
    tags:
      - "v*"

env:
  DOTNET_VERSION: "10.0.x"
  PACKAGE_OUTPUT: ./output

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet restore

      - run: dotnet build --configuration Release --no-restore

      - run: dotnet test --configuration Release --no-build --no-restore

      - run: dotnet pack --configuration Release --no-build --output ${{ env.PACKAGE_OUTPUT }} /p:Version=${GITHUB_REF_NAME#v}

      - run: dotnet nuget push "${{ env.PACKAGE_OUTPUT }}/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
